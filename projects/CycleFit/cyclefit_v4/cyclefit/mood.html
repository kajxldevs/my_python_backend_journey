<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check In — CycleFit</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .mood-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .mood-container { width: 100%; max-width: 600px; }
    .mood-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--accent-orange);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .mood-container h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 0.5rem; }
    .mood-sub { color: var(--subtext); margin-bottom: 3rem; font-size: 0.95rem; }
    .mood-section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--subtext);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .mood-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      margin-bottom: 3rem;
    }
    .mood-tile {
      background: var(--bg-card);
      padding: 2rem 1.5rem;
      cursor: pointer;
      border: 2px solid transparent;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mood-tile:hover { border-color: var(--accent-orange); transform: translateY(-3px); }
    .mood-tile.selected { background: var(--accent-red); border-color: var(--accent-red); color: #F5F5F5; }
    .energy-section { margin-bottom: 3rem; }
    .energy-display {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent-orange);
      text-align: center;
      margin-bottom: 1rem;
      line-height: 1;
    }
    .energy-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--subtext);
      margin-bottom: 0.8rem;
    }
    input[type="range"] {
      width: 100%;
      height: 3px;
      background: var(--border);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--accent-red);
      cursor: pointer;
    }
    .submit-section { border-top: 1px solid var(--border); padding-top: 2rem; }
    .status-msg { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--accent-green); display: none; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">CycleFit</a>
    <a href="dashboard.html" style="color:var(--subtext); font-size:0.85rem;">Skip for now</a>
  </nav>

  <div class="mood-page">
    <div class="mood-container">
      <p class="mood-eyebrow">Daily check-in</p>
      <h1>How are you showing up today?</h1>
      <p class="mood-sub">Your workout will adjust to match how you actually feel.</p>

      <p class="mood-section-label">Mood</p>
      <div class="mood-grid">
        <div class="mood-tile" data-mood="Low" onclick="selectMood(this)">Low</div>
        <div class="mood-tile" data-mood="Okay" onclick="selectMood(this)">Okay</div>
        <div class="mood-tile" data-mood="Good" onclick="selectMood(this)">Good</div>
        <div class="mood-tile" data-mood="Great" onclick="selectMood(this)">Great</div>
      </div>

      <div class="energy-section">
        <p class="mood-section-label">Energy Level</p>
        <div class="energy-display" id="energy-display">5</div>
        <div class="energy-label-row">
          <span>Depleted</span>
          <span>Energized</span>
        </div>
        <input type="range" min="1" max="10" value="5" id="energy-slider" oninput="updateEnergy(this.value)">
      </div>

      <div class="submit-section">
        <button class="btn btn-primary btn-full" onclick="submitCheckin()" style="font-size:1rem; padding:1.1rem;">
          See Today's Workout
        </button>
        <p class="status-msg" id="status-msg">Saving...</p>
      </div>
    </div>
  </div>

  <script>
    let selectedMood = null;

    function selectMood(tile) {
      document.querySelectorAll('.mood-tile').forEach(t => t.classList.remove('selected'));
      tile.classList.add('selected');
      selectedMood = tile.dataset.mood;
    }

    function updateEnergy(val) {
      document.getElementById('energy-display').textContent = val;
    }

    async function submitCheckin() {
      const energy = parseInt(document.getElementById('energy-slider').value);
      const statusEl = document.getElementById('status-msg');

      if (!selectedMood) {
        alert('Please select your mood before continuing.');
        return;
      }

      const checkin = {
        date: new Date().toLocaleDateString('en-GB'),
        mood: selectedMood,
        energy: energy
      };
      localStorage.setItem('cf_mood_today', JSON.stringify(checkin));

      statusEl.style.display = 'block';
      statusEl.textContent = 'Saving...';

      try {
        await apiSaveMood(selectedMood, energy);
      } catch (err) {
        console.log('API save failed, continuing anyway');
      }

      statusEl.textContent = 'Check-in saved!';
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
